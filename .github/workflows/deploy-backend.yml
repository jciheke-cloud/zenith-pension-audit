name: Build & Deploy Audit Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Audit Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Create Backend Deployment Package
        working-directory: ./backend
        run: zip -r backend-package.zip . -x "*.git*" "node_modules/*"

      - name: Deploy Audit Backend to AWS Elastic Beanstalk
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'eu-west-1'
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "🚀 AWS Credentials found! Deploying Audit Backend to Elastic Beanstalk..."
            
            # Note: Ensure the environment matches your actual EB environment names
            aws s3 cp ./backend/backend-package.zip s3://riskintegra-erm-audit-backend-bucket/backend-package-${{ github.sha }}.zip
            
            aws elasticbeanstalk create-application-version \
              --application-name "AuditAppBackend" \
              --version-label "${{ github.sha }}" \
              --source-bundle S3Bucket="riskintegra-erm-audit-backend-bucket",S3Key="backend-package-${{ github.sha }}.zip"
            
            aws elasticbeanstalk update-environment \
              --environment-name "AuditAppBackend-env" \
              --version-label "${{ github.sha }}"
              
            echo "✅ Audit Backend GitHub Actions Deployment initiated successfully!"
          else
            echo "ℹ️ AWS Secrets (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) not found in GitHub Secrets."
          fi
